<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LoanML{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('loanml-theme') || 'dark');
</script>
</head>
<body>

  <div class="nav">
    <div class="nav-inner">
      <a class="logo" href="{{ url_for('home') }}">
        <span class="mark">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
        </span>
        LoanML
      </a>
      <div class="navlinks">
        <a href="{{ url_for('home') }}" class="{{ 'active' if active=='home' }}">Home</a>
        <a href="{{ url_for('predict_page') }}" class="{{ 'active' if active=='predict' }}">Predict Risk</a>
      </div>
      <div class="nav-actions">
        <button class="theme-btn" id="themeBtn" aria-label="Toggle theme"></button>
        <a class="btn-primary" href="{{ url_for('predict_page') }}">Analyze Loan Risk</a>
      </div>
    </div>
  </div>

  {% block content %}{% endblock %}

  <footer class="site-footer">
    LoanML — AI-powered loan default risk analysis. Common Project Model, ML Project SOP.
    Estimates are decision-support information from a statistical model, not a lending decision.
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
